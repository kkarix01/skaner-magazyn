<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skaner kodu</title>

  <!-- html5-qrcode: skanowanie EAN-13 z aparatu -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #0b1220;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      background: #f4f6f8;
      color: #17202a;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #044cab;
      color: white;
      padding: calc(18px + env(safe-area-inset-top)) 18px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    header p {
      margin: 6px 0 0;
      opacity: .85;
      font-size: 14px;
    }

    main {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .scanner-card {
      background: #111827;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }

    #reader {
      width: 100%;
      min-height: 360px;
    }

    /* Ukrywamy domyślne UI biblioteki - chcemy własny wygląd. */
    #reader__dashboard,
    #reader__dashboard_section_csr,
    #reader__dashboard_section_swaplink {
      display: none !important;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      display: block;
      object-fit: cover;
    }

    .status {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #fff;
      text-align: center;
      font-size: 15px;
    }

    .status.error {
      background: #fff0f0;
      color: #a40000;
    }

    .status.success {
      background: #eaf8ee;
      color: #146b2e;
    }

    .code {
      margin-top: 8px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      word-break: break-all;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #closeButton {
      background: #e7ebf0;
      color: #17202a;
    }

    #retryButton {
      background: #044cab;
      color: white;
      display: none;
    }

    .hint {
      margin-top: 14px;
      color: #66727e;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>📷 Skanuj kod</h1>
      <p>Skieruj aparat na kod kreskowy</p>
    </header>

    <main>
      <div class="scanner-card">
        <div id="reader"></div>
      </div>

      <div id="status" class="status">
        Uruchamiam aparat…
      </div>

      <div id="result" class="status success" style="display:none;">
        <div>Kod odczytany</div>
        <div id="code" class="code"></div>
      </div>

      <button id="retryButton" type="button">🔄 Skanuj ponownie</button>
      <button id="closeButton" type="button">Zamknij skaner</button>

      <div class="hint">
        Skaner obsługuje m.in. EAN-13. Po odczytaniu kod zostanie przekazany do aplikacji magazynowej.
      </div>
    </main>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const codeEl = document.getElementById('code');
    const retryButton = document.getElementById('retryButton');
    const closeButton = document.getElementById('closeButton');

    let scanner = null;
    let scanning = false;
    let lastCode = null;

    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    async function stopScanner() {
      if (!scanner || !scanning) return;

      try {
        await scanner.stop();
      } catch (e) {
        console.warn('Nie udało się zatrzymać skanera:', e);
      }

      scanning = false;
    }

    async function startScanner() {
      await stopScanner();

      resultEl.style.display = 'none';
      retryButton.style.display = 'none';
      setStatus('Uruchamiam aparat…');

      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13]
      });

      const config = {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const width = Math.min(Math.floor(viewfinderWidth * 0.82), 360);
          const height = Math.min(Math.floor(viewfinderHeight * 0.32), 140);
          return { width, height };
        },
        aspectRatio: 1.7777778
      };

      try {
        await scanner.start(
          { facingMode: 'environment' },
          config,
          handleSuccess,
          function() {
            // Brak odczytu w pojedynczej klatce — ignorujemy.
          }
        );

        scanning = true;
        setStatus('Gotowe — skieruj aparat na kod EAN.');
      } catch (error) {
        console.error(error);
        setStatus(
          'Nie udało się uruchomić aparatu. Sprawdź zgodę na aparat i użyj strony HTTPS.',
          'error'
        );
        retryButton.style.display = 'block';
      }
    }

    async function handleSuccess(decodedText) {
      if (!decodedText || decodedText === lastCode) return;

      lastCode = decodedText;

      await stopScanner();

      codeEl.textContent = decodedText;
      resultEl.style.display = 'block';
      setStatus('Kod odczytany ✓', 'success');

      // Jeśli skaner został otwarty z aplikacji magazynowej,
      // przekazujemy kod do okna nadrzędnego.
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          {
            type: 'barcode',
            code: String(decodedText).trim()
          },
          '*'
        );

        // Krótkie opóźnienie, żeby użytkownik zobaczył potwierdzenie.
        setTimeout(() => {
          try {
            window.close();
          } catch (e) {}
        }, 500);
      }
    }

    retryButton.addEventListener('click', () => {
      lastCode = null;
      startScanner();
    });

    closeButton.addEventListener('click', async () => {
      await stopScanner();

      if (window.opener && !window.opener.closed) {
        window.close();
      } else {
        history.back();
      }
    });

    startScanner();
  </script>
</body>
</html>
